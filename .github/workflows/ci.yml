name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ci
      - name: Upload coverage and JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-node-${{ matrix.node-version }}
          path: |
            coverage/
            reports/junit.xml
